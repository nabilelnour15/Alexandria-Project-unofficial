# Every 3 days: find new, verified Alexandria news, write the blog posts and open a
# pull request. Instructions for Claude: .github/prompts/news-refresh.md
# Needs the ANTHROPIC_API_KEY repository secret. Schedules only run once this file is on
# the default branch (production); the bot itself works from main and opens PRs into main.
name: News refresh

on:
  schedule:
    - cron: '0 4 */3 * *' # 04:00 UTC (07:00 Cairo, summer time) on days 1, 4, 7, …
  workflow_dispatch:

# The two content bots never run at the same time, so their pull requests don't collide.
concurrency:
  group: content-bot
  cancel-in-progress: false

permissions: {}

env:
  BRANCH: bot/news-refresh
  # The only files this bot may change.
  BOT_FILES: src/data/newsData.ts src/data/newsPosts.ts

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Read-only on purpose: this job reads arbitrary web pages, so it can't push anything.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}
      branch_sha: ${{ steps.base.outputs.branch_sha }}
      has_changes: ${{ steps.package.outputs.has_changes }}
    steps:
      - name: Check the API key is set
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the ANTHROPIC_API_KEY repository secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # Work happens on main (production is the default branch, which schedules run from).
          ref: main
          fetch-depth: 0
          persist-credentials: false

      # If the last news PR hasn't been merged yet, build on it so nothing is lost or duplicated.
      - name: Continue the open bot pull request, if any
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha 2>/dev/null || true)
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')" ]; then
            git checkout --detach "$branch_sha"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch_sha=$branch_sha" >> "$GITHUB_OUTPUT"
          echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Claude gets no shell, may only edit the data files and its report, and can't read
      # system or git files. Sonnet orchestrates; the subagents set their own models in
      # .claude/agents/ (source-researcher and news-writer: Sonnet, claim-verifier: Haiku).
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Today is ${{ steps.base.outputs.today }}.
            Follow the instructions in .github/prompts/news-refresh.md exactly.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 80
            --allowedTools "Read,Glob,Grep,WebSearch,WebFetch,Agent,Task,Edit(src/data/newsData.ts),Edit(src/data/newsPosts.ts),Write(bot-report.md),Edit(bot-report.md)"
            --disallowedTools "Bash,NotebookEdit,Read(//proc/**),Read(//etc/**),Read(//sys/**),Read(~/**),Read(.git/**),Read(.env*)"

      # Package from a fresh checkout so nothing in this working tree (git config, hooks,
      # symlinks) can influence the patch. Only regular files on the allow-list are copied.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: clean
          persist-credentials: false

      - name: Package the changes
        id: package
        run: |
          for f in $BOT_FILES; do
            if [ -f "$f" ] && [ ! -L "$f" ]; then cp "$f" "clean/$f"; fi
          done
          if [ -f bot-report.md ] && [ ! -L bot-report.md ]; then head -c 200000 bot-report.md > "$RUNNER_TEMP/bot-report.md"; else echo "The bot wrote no report." > "$RUNNER_TEMP/bot-report.md"; fi
          cat "$RUNNER_TEMP/bot-report.md" >> "$GITHUB_STEP_SUMMARY"
          git -C clean diff --no-ext-diff --no-textconv -- $BOT_FILES > "$RUNNER_TEMP/changes.patch"
          if [ -s "$RUNNER_TEMP/changes.patch" ]; then echo "has_changes=true" >> "$GITHUB_OUTPUT"; else echo "has_changes=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: bot-changes
          path: |
            ${{ runner.temp }}/changes.patch
            ${{ runner.temp }}/bot-report.md
          retention-days: 14

  pull-request:
    needs: research
    if: needs.research.outputs.has_changes == 'true'
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: ./.github/workflows/bot-pr.yml
    with:
      branch: bot/news-refresh
      base_sha: ${{ needs.research.outputs.base_sha }}
      branch_sha: ${{ needs.research.outputs.branch_sha }}
      allowed_paths: '^src/data/(newsData|newsPosts)\.ts$'
      title: 'News: new stories from the bot'
      label: news-bot
