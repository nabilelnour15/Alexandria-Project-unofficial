<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alexandria - Digital Gateway (unofficial)</title>
    <meta
      name="description"
      content="An unofficial fan guide to Alexandria, Egypt: 2,300 years of history, places to visit, city projects and investment opportunities on the Mediterranean."
    />
    <meta name="theme-color" content="#0E1A24" />
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg" />

    <!-- Fonts: Cormorant Garamond (headings), Open Sans (body), Noto Naskh Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Noto+Naskh+Arabic:wght@400;600&family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    />

    <!-- Open Graph. Crawlers need absolute URLs.
         TODO: replace https://alexandria-unofficial.example/ with the real deployed domain
         (og:url, og:image and twitter:image). -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://alexandria-unofficial.example/" />
    <meta property="og:site_name" content="Alexandria – Digital Gateway (unofficial)" />
    <meta property="og:title" content="Alexandria – Digital Gateway (unofficial)" />
    <meta
      property="og:description"
      content="An unofficial fan guide to Alexandria, Egypt: history, places to visit, city projects and investment opportunities."
    />
    <meta property="og:image" content="https://alexandria-unofficial.example/images/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Alexandria – Digital Gateway (unofficial)" />
    <meta
      name="twitter:description"
      content="An unofficial fan guide to Alexandria, Egypt: history, places to visit, city projects and investment opportunities."
    />
    <!-- TODO: replace with the real deployed domain -->
    <meta name="twitter:image" content="https://alexandria-unofficial.example/images/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
